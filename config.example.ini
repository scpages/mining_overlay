[monitors]
# Which monitor the game runs on (1 = primary monitor)
game_monitor = 1

# Which monitor to show the overlay on
# Set to 1 if you only have one monitor, 2 for a second monitor
overlay_monitor = 2

[region]
# Which ship/tool you're using. Selects a known-good capture region
# automatically for supported ship + resolution combinations.
# See profiles.py for the current list of calibrated profiles.
ship = golem

# Manual override — only needed if there's no built-in profile yet for your
# ship/resolution, or the built-in one doesn't line up for you.
# Values are fractions of your screen size (between 0.0 and 1.0).
# Uncomment all four and run debug_capture.py to find working values.
#x = 0.459
#y = 0.367
#w = 0.086
#h = 0.042

[settings]
# How many unique readings to keep on screen at once (default: 5)
history_size = 5

# Readings above this RS value are ignored — there are no real resources this high
max_rs = 100000

# Save debug images to a debug/ folder while running (true/false)
# Only useful for troubleshooting — leave this as false normally
debug = false
